name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: write        # gh run delete + gh cache delete
  contents: read        # gh api repos/.../git/refs (cleanup-caches LIVE_REFS lookup)
  pull-requests: read   # gh pr list (open-PR head SHAs, retained below)

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RETAIN_DAYS: 7
      KEEP_MINIMUM: 5   # PER WORKFLOW — see below
    steps:
      - name: Delete old workflow runs
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "${RETAIN_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Two retention rules, each closing a real failure mode:
          # 1. Keep the newest KEEP_MINIMUM runs PER WORKFLOW, not globally. Deleting
          #    a workflow's last run flips it to `state: deleted` (gone from the
          #    Actions tab). A global minimum purges every run of a workflow that runs
          #    less often than the busy ones — e.g. the Renovate autofix workflows.
          # 2. Never delete a run whose head SHA is an OPEN PR's head: that run
          #    carries the required `ci-pass` check, and deleting it leaves the PR
          #    BLOCKED with no checks once it has been idle longer than RETAIN_DAYS.
          OPEN_SHAS=$(gh pr list --repo "$REPO" --state open --limit 200 --json headRefOid --jq '[.[].headRefOid]')
          # Size the listing from the API's own total so it is never silently truncated.
          TOTAL=$(gh api "repos/$REPO/actions/runs?per_page=1" --jq .total_count)
          # `--arg`/`--argjson` pass values into jq via the JSON variable space —
          # no shell interpolation into the filter string, no quoting traps.
          gh run list --repo "$REPO" --limit "$((TOTAL + 50))" \
            --json databaseId,createdAt,workflowName,headSha \
          | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM" --argjson open "$OPEN_SHAS" '
              group_by(.workflowName)
              | map(sort_by(.createdAt) | reverse | .[$keep:])
              | add // []
              | .[]
              | select(.createdAt < $cutoff)
              | select(.headSha as $s | ($open | index($s)) | not)
              | .databaseId' \
          | xargs -r -I{} gh run delete {} --repo "$REPO"

  cleanup-caches:
    # Stale caches from merged/deleted branches accumulate against the 10 GB
    # repo limit and silently evict caches the active branches still need.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete caches for deleted branches
        run: |
          set -euo pipefail
          # Live refs in the repo (heads + tags), normalised to refs/heads/<name>.
          LIVE_REFS=$(gh api "repos/${{ github.repository }}/git/refs" --jq '.[].ref' | sort -u)
          # Every cache, with its ref. gh cache list returns ref like refs/heads/main or refs/pull/N/merge.
          gh cache list --repo "${{ github.repository }}" --limit 200 --json id,ref --jq '.[] | [.id, .ref] | @tsv' \
          | while IFS=$'\t' read -r id ref; do
              # Always preserve caches scoped to live branches/tags.
              if grep -qx "$ref" <<<"$LIVE_REFS"; then
                continue
              fi
              # PR caches whose source branch was deleted are safe to delete.
              echo "Deleting cache id=$id ref=$ref"
              gh cache delete "$id" --repo "${{ github.repository }}" || true
            done
